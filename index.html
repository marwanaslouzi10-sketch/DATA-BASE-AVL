<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVL | ARABIC VIRTUAL LEAGUE</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: rgba(18, 22, 36, 0.75);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text-light: #f0f3f8;
            --text-dim: #8a99ad;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(79, 172, 254, 0.15), transparent 70%),
                radial-gradient(circle at 10% 80%, rgba(255, 215, 0, 0.08), transparent 50%);
        }

        /* --- Canvas Background Particles --- */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* --- Cinematic Page Transition Overlay --- */
        #page-transition-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #050608 0%, #0d1322 50%, #050608 100%);
            z-index: 900;
            pointer-events: none;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.3s ease;
            box-shadow: 0 0 50px var(--primary);
        }

        #page-transition-overlay.active-transition {
            pointer-events: all;
            opacity: 1;
            transform: scaleX(1);
            transform-origin: left;
        }

        /* --- Intro Screen --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: #050608;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.77, 0, 0.175, 1), transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .intro-scene {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Trophy Container */
        .trophy-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 25px var(--gold));
            animation: floatTrophy 4s ease-in-out infinite;
        }

        .trophy-icon {
            font-size: 80px;
            background: linear-gradient(135deg, #fff6b7 0%, #f6d365 50%, #dda200 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glowing-ball {
            position: absolute;
            top: -10px;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #ffffff, var(--gold));
            border-radius: 50%;
            box-shadow: 0 0 20px var(--gold), 0 0 40px #fff;
            animation: orbitBall 3s linear infinite;
        }

        @keyframes floatTrophy {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes orbitBall {
            0% { transform: rotate(0deg) translateX(55px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(55px) rotate(-360deg); }
        }

        .title-avl {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a8ba 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.8);
            animation: zoomInText 1s ease forwards 0.5s;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .title-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--gold);
            margin-top: 5px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.2s;
            text-transform: uppercase;
        }

        .intro-nav-options {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.8s;
            flex-wrap: wrap;
            justify-content: center;
        }

        .enter-btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background: linear-gradient(90deg, #ffe066, var(--gold));
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--gold-glow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .enter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px var(--gold);
        }

        .enter-btn.secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid var(--border);
            box-shadow: none;
        }

        .enter-btn.secondary-btn:hover {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
        }

        /* --- Header & Navigation --- */
        header {
            position: relative;
            z-index: 10;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
        }

        .logo-text span { color: var(--gold); }

        nav {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            transform: translateY(-2px);
        }

        /* --- Main Content Area --- */
        main {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            perspective: 1000px;
        }

        .page-section {
            display: none;
            opacity: 0;
            transform: scale(0.92) translateY(40px) rotateX(10deg);
            filter: blur(8px);
            transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                        filter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .page-section.active {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0) rotateX(0deg);
            filter: blur(0);
        }

        .section-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .section-subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        /* --- Custom Tables --- */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            padding: 16px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
            transition: background 0.2s ease;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.04);
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-start;
            font-weight: 700;
        }

        .team-badge {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
        }

        tr.gold-row {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.12), transparent);
        }

        tr.gold-row td {
            color: #fff;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        tr.gold-row .team-badge {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 12px var(--gold-glow);
            font-weight: 900;
        }

        .gold-badge-icon {
            color: var(--gold);
            margin-left: 6px;
            filter: drop-shadow(0 0 5px var(--gold));
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- Teams Grid --- */
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .team-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .team-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.2);
        }

        .team-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .team-card-icon {
            width: 45px;
            height: 45px;
            background: rgba(79, 172, 254, 0.1);
            border: 1px solid var(--secondary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .team-card-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
        }

        .team-card-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .info-label {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .info-value {
            color: var(--primary);
            font-family: monospace;
            font-size: 0.9rem;
        }

        .info-value.na {
            color: var(--text-dim);
            font-style: italic;
        }

        .players-section {
            margin-top: 15px;
            border-top: 1px dashed var(--border);
            padding-top: 12px;
        }

        .players-title {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .player-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
        }

        @keyframes zoomInText {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }

            .title-avl { font-size: 2.5rem; }
            .title-sub { font-size: 0.85rem; }

            th, td {
                padding: 10px 5px;
                font-size: 0.8rem;
            }

            .team-cell { gap: 6px; }
            .team-badge { width: 25px; height: 25px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- Cinematic Transition Overlay -->

    <!-- Intro / Hero Screen -->

            <div class="intro-nav-options">

                    </thead>
                    <tbody id="div1-tbody">

                    </tbody>
                </table>
            </div>
        </section>

        <!-- DIVISION 2 PAGE -->
        <section id="div2" class="page-section">
            <div class="section-header">
                <h1 class="section-title">DIVISION 2</h1>
                <p class="section-subtitle">جدول الترتيب الحالي للقسم الثاني</p>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th style="text-align: right;">الفريق</th>

                            <th>عليه</th>
                            <th>+/-</th>
                            <th>النقاط</th>
                        </tr>
                    </thead>
                    <tbody id="div2-tbody">
