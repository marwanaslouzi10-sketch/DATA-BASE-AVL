<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVL | ARABIC VIRTUAL LEAGUE</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: rgba(18, 22, 36, 0.75);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text-light: #f0f3f8;
            --text-dim: #8a99ad;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(79, 172, 254, 0.15), transparent 70%),
                radial-gradient(circle at 10% 80%, rgba(255, 215, 0, 0.08), transparent 50%);
        }

        /* --- Canvas Background Particles --- */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* --- Intro Screen --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: #050608;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s;
        }

        .intro-scene {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 3D-Style Trophy Container */
        .trophy-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 25px var(--gold));
            animation: floatTrophy 4s ease-in-out infinite;
        }

        .trophy-icon {
            font-size: 80px;
            background: linear-gradient(135deg, #fff6b7 0%, #f6d365 50%, #dda200 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Animated Glowing Ball */
        .glowing-ball {
            position: absolute;
            top: -10px;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #ffffff, var(--gold));
            border-radius: 50%;
            box-shadow: 0 0 20px var(--gold), 0 0 40px #fff;
            animation: orbitBall 3s linear infinite;
        }

        @keyframes floatTrophy {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes orbitBall {
            0% { transform: rotate(0deg) translateX(55px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(55px) rotate(-360deg); }
        }

        .title-avl {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a8ba 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.8);
            animation: zoomInText 1s ease forwards 0.5s;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .title-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--gold);
            margin-top: 5px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.2s;
            text-transform: uppercase;
        }

        .enter-btn {
            margin-top: 40px;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            background: linear-gradient(90deg, #ffe066, var(--gold));
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--gold-glow);
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.8s;
            transition: all 0.3s ease;
        }

        .enter-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px var(--gold);
        }

        /* --- Header & Navigation --- */
        header {
            position: relative;
            z-index: 10;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
        }

        .logo-text span { color: var(--gold); }

        nav {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            transform: translateY(-2px);
        }

        /* --- Main Content Area --- */
        main {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .page-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .section-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .section-subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        /* --- Custom Tables --- */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            padding: 16px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
            transition: background 0.2s ease;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.04);
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-start;
            font-weight: 700;
        }

        .team-badge {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
        }

        /* First Place Special Style */
        tr.gold-row {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.12), transparent);
        }

        tr.gold-row td {
            color: #fff;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        tr.gold-row .team-badge {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 12px var(--gold-glow);
            font-weight: 900;
        }

        .gold-badge-icon {
            color: var(--gold);
            margin-left: 6px;
            filter: drop-shadow(0 0 5px var(--gold));
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- Teams Grid --- */
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .team-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .team-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.2);
        }

        .team-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .team-card-icon {
            width: 45px;
            height: 45px;
            background: rgba(79, 172, 254, 0.1);
            border: 1px solid var(--secondary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .team-card-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
        }

        .team-card-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .info-label {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .info-value {
            color: var(--primary);
            font-family: monospace;
            font-size: 0.9rem;
        }

        .info-value.na {
            color: var(--text-dim);
            font-style: italic;
        }

        /* --- Animations --- */
        @keyframes zoomInText {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }

            .title-avl { font-size: 2.5rem; }
            .title-sub { font-size: 0.85rem; }

            th, td {
                padding: 10px 5px;
                font-size: 0.8rem;
            }

            .team-cell { gap: 6px; }
            .team-badge { width: 25px; height: 25px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="particles-canvas"></canvas>

    <!-- Intro / Hero Screen -->
    <div id="intro-screen">
        <div class="intro-scene">
            <div class="trophy-container">
                <i class="fa-solid fa-trophy trophy-icon"></i>
                <div class="glowing-ball"></div>
            </div>
            <div class="title-avl">AVL</div>
            <div class="title-sub">Arabic Virtual League — Season 1</div>
            <button class="enter-btn" onclick="enterLeague()">دخول الدوري <i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </div>

    <!-- Header / Navigation -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-shield-halved" style="color: var(--gold); font-size: 1.8rem;"></i>
            <div class="logo-text">AVL <span>LEAGUE</span></div>
        </div>
        <nav>
            <button class="nav-btn active" onclick="switchPage('div1', this)">
                <i class="fa-solid fa-crown"></i> Division 1
            </button>
            <button class="nav-btn" onclick="switchPage('div2', this)">
                <i class="fa-solid fa-shield"></i> Division 2
            </button>
            <button class="nav-btn" onclick="switchPage('teams', this)">
                <i class="fa-solid fa-users"></i> Teams
            </button>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        
        <!-- DIVISION 1 PAGE -->
        <section id="div1" class="page-section active">
            <div class="section-header">
                <h1 class="section-title">DIVISION 1</h1>
                <p class="section-subtitle">جدول الترتيب الحالي للقسم الأول</p>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th style="text-align: right;">الفريق</th>
                            <th>لعب</th>
                            <th>فاز</th>
                            <th>تعادل</th>
                            <th>خسر</th>
                            <th>له</th>
                            <th>عليه</th>
                            <th>+/-</th>
                            <th>النقاط</th>
                        </tr>
                    </thead>
                    <tbody id="div1-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- DIVISION 2 PAGE -->
        <section id="div2" class="page-section">
            <div class="section-header">
                <h1 class="section-title">DIVISION 2</h1>
                <p class="section-subtitle">جدول الترتيب الحالي للقسم الثاني</p>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th style="text-align: right;">الفريق</th>
                            <th>لعب</th>
                            <th>فاز</th>
                            <th>تعادل</th>
                            <th>خسر</th>
                            <th>له</th>
                            <th>عليه</th>
                            <th>+/-</th>
                            <th>النقاط</th>
                        </tr>
                    </thead>
                    <tbody id="div2-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- TEAMS PAGE -->
        <section id="teams" class="page-section">
            <div class="section-header">
                <h1 class="section-title">ALL TEAMS</h1>
                <p class="section-subtitle">قائمة جميع الأندية والإدارة (Owner & Manager)</p>
            </div>
            <div class="teams-grid" id="teams-grid">
                <!-- Populated by JS -->
            </div>
        </section>

    </main>

    <script>
        /* --- Data Store --- */
        const div1Data = [
            { pos: 1, name: "RCA", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@mejinina_2>", manager: "<@.themagic.>" },
            { pos: 2, name: "WAC", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@andrewwww___.>", manager: "N/A" },
            { pos: 3, name: "KAC", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@anasss0876>", manager: "N/A" },
            { pos: 4, name: "KACM", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@hamza_founti>", manager: "<@l5ofax.06>" },
            { pos: 5, name: "CRB", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@alilo_crb>", manager: "<@skwadra_0049>" },
            { pos: 6, name: "MAS", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@zacky_fesska>", manager: "<@reslienzav2>" },
            { pos: 7, name: "IRT", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@tanjawi_uh_07>", manager: "N/A" },
            { pos: 8, name: "JSK", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@maheroujda0roblox>", manager: "N/A" }
        ];

        const div2Data = [
            { pos: 1, name: "Zamalek", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@spi7_x>", manager: "N/A" },
            { pos: 2, name: "USMH", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@1chr1f.s.57>", manager: "N/A" },
            { pos: 3, name: "Al Ahly", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<selm_95750>", manager: "N/A" },
            { pos: 4, name: "ASFAR", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@ziyad__77>", manager: "N/A" },
            { pos: 5, name: "USMA", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "N/A", manager: "N/A" },
            { pos: 6, name: "ESS", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@mouhamedhamdi>", manager: "N/A" },
            { pos: 7, name: "RAC", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "<@spxxwalid>", manager: "N/A" },
            { pos: 8, name: "MCA", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, owner: "N/A", manager: "N/A" }
        ];

        /* --- Render Functions --- */
        function renderTable(data, elementId) {
            const tbody = document.getElementById(elementId);
            tbody.innerHTML = "";

            data.forEach(team => {
                const tr = document.createElement("tr");
                if (team.pos === 1) tr.classList.add("gold-row");

                tr.innerHTML = `
                    <td>${team.pos === 1 ? '<i class="fa-solid fa-crown gold-badge-icon"></i> 1' : team.pos}</td>
                    <td>
                        <div class="team-cell">
                            <div class="team-badge">${team.name.substring(0, 2).toUpperCase()}</div>
                            <span>${team.name}</span>
                        </div>
                    </td>
                    <td>${team.p}</td>
                    <td>${team.w}</td>
                    <td>${team.d}</td>
                    <td>${team.l}</td>
                    <td>${team.gf}</td>
                    <td>${team.ga}</td>
                    <td>${team.gd}</td>
                    <td style="font-weight: bold; color: ${team.pos === 1 ? 'var(--gold)' : 'var(--primary)'}">${team.pts}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderTeams() {
            const grid = document.getElementById("teams-grid");
            grid.innerHTML = "";

            const allTeams = [
                ...div1Data.map(t => ({ ...t, div: "Division 1" })),
                ...div2Data.map(t => ({ ...t, div: "Division 2" }))
            ];

            allTeams.forEach(team => {
                const card = document.createElement("div");
                card.className = "team-card";
                card.innerHTML = `
                    <div class="team-card-header">
                        <div class="team-card-icon"><i class="fa-solid fa-shield-cat"></i></div>
                        <div>
                            <div class="team-card-title">${team.name}</div>
                            <span style="font-size: 0.75rem; color: var(--text-dim);">${team.div}</span>
                        </div>
                    </div>
                    <div class="team-card-info">
                        <div class="info-row">
                            <span class="info-label"><i class="fa-solid fa-user-gear"></i> Owner</span>
                            <span class="info-value ${team.owner === 'N/A' ? 'na' : ''}">${team.owner}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fa-solid fa-user-tie"></i> Manager</span>
                            <span class="info-value ${team.manager === 'N/A' ? 'na' : ''}">${team.manager}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        /* --- Navigation Controller --- */
        function switchPage(pageId, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const activeSection = document.querySelector('.page-section.active');
            if (activeSection) {
                activeSection.style.opacity = '0';
                activeSection.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    activeSection.classList.remove('active');
                    const targetSection = document.getElementById(pageId);
                    targetSection.classList.add('active');
                    setTimeout(() => {
                        targetSection.style.opacity = '1';
                        targetSection.style.transform = 'translateY(0)';
                    }, 50);
                }, 300);
            }
        }

        function enterLeague() {
            const intro = document.getElementById("intro-screen");
            intro.style.opacity = "0";
            setTimeout(() => {
                intro.style.display = "none";
            }, 1000);
        }

        /* --- Background Particles Canvas --- */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(79, 172, 254, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        /* --- Initialization --- */
        window.onload = () => {
            renderTable(div1Data, "div1-tbody");
            renderTable(div2Data, "div2-tbody");
            renderTeams();
            initParticles();
            animateParticles();
        };
    </script>
</body>
</html>
